name: Build SoudDuck APK

on:
  push:
    branches: [ soudduck-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore SoudDuck interface
        working-directory: soudduck-build-app
        run: base64 -d app/src/main/assets/index.html.gz.b64 | gzip -d > app/src/main/assets/index.html
      - name: Build APK
        working-directory: soudduck-build-app
        run: gradle assembleDebug --stacktrace
      - name: Prepare APK
        run: cp soudduck-build-app/app/build/outputs/apk/debug/app-debug.apk SoudDuck-v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoudDuck-APK
          path: SoudDuck-v0.1-debug.apk
