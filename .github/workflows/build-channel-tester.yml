name: Build Channel Tester APK

on:
  push:
    branches:
      - channel-tester-build
    paths:
      - 'channel-tester/**'
      - '.github/workflows/build-channel-tester.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'channel-tester/**'
      - '.github/workflows/build-channel-tester.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: channel-tester

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK and capture log
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "$code" > build-exit-code.txt
          exit 0

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: channel-tester-build-log
          path: |
            channel-tester/build.log
            channel-tester/build-exit-code.txt
          if-no-files-found: error

      - name: Upload APK when generated
        uses: actions/upload-artifact@v4
        with:
          name: atlas-channel-tester-apk
          path: channel-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Mark failed build
        shell: bash
        run: |
          code=$(cat build-exit-code.txt)
          if [ "$code" != "0" ]; then
            echo "Gradle build failed with exit code $code"
            exit "$code"
          fi
