name: Build Channel Tester APK

on:
  push:
    branches:
      - channel-tester-build
    paths:
      - 'channel-tester/**'
      - '.github/workflows/build-channel-tester.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone, build and publish APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch channel-tester-build \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
          cd source/channel-tester
          java -version
          gradle --version
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          gradle :app:assembleDebug --stacktrace
          cd ..
          mkdir -p channel-tester-output
          cp channel-tester/app/build/outputs/apk/debug/app-debug.apk \
            channel-tester-output/AtlasChannelTester.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channel-tester-output/AtlasChannelTester.apk
          git commit -m "Build channel tester APK"
          git push origin HEAD:channel-tester-build
