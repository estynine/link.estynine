plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atlascine.channeltester'
    compileSdk 35

    defaultConfig {
        applicationId 'com.atlascine.channeltester'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0-live-probe'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
